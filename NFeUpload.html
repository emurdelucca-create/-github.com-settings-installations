<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Google Sans', Arial, sans-serif; }
  body { padding: 20px; background: #f8f9fa; color: #202124; font-size: 14px; }
  h2 { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: #1a73e8; }

  .card {
    background: #fff;
    border: 1px solid #dadce0;
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 12px;
  }

  .spinner {
    display: inline-block;
    width: 18px; height: 18px;
    border: 2px solid #e0e0e0;
    border-top-color: #1a73e8;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .status { margin: 8px 0; line-height: 1.6; }
  .ok   { color: #188038; }
  .err  { color: #c5221f; }
  .muted { color: #5f6368; font-size: 12px; }

  .file-label {
    display: block;
    border: 2px dashed #1a73e8;
    border-radius: 6px;
    padding: 18px;
    text-align: center;
    cursor: pointer;
    color: #1a73e8;
    background: #f0f6ff;
    transition: background 0.2s;
  }
  .file-label:hover { background: #e3f0ff; }
  input[type=file] { display: none; }

  .btn {
    display: inline-block;
    padding: 9px 24px;
    border: none;
    border-radius: 4px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 500;
    margin-right: 8px;
  }
  .btn-primary  { background: #1a73e8; color: #fff; }
  .btn-primary:hover  { background: #1557b0; }
  .btn-primary:disabled  { background: #9aa0a6; cursor: not-allowed; }
  .btn-secondary { background: #fff; color: #1a73e8; border: 1px solid #1a73e8; }
  .btn-secondary:hover { background: #f0f6ff; }
  .btn-secondary:disabled { color: #9aa0a6; border-color: #9aa0a6; cursor: not-allowed; }

  progress {
    width: 100%;
    height: 6px;
    border-radius: 3px;
    border: none;
    accent-color: #1a73e8;
    margin-top: 8px;
  }

  .log {
    font-size: 12px;
    font-family: monospace;
    background: #f1f3f4;
    border-radius: 4px;
    padding: 8px;
    max-height: 160px;
    overflow-y: auto;
    margin-top: 8px;
    color: #3c4043;
    line-height: 1.5;
  }
</style>
</head>
<body>

<!-- Etapa 1: carregamento -->
<div class="card" id="secCarregar">
  <div class="status" id="msgCarregar">
    <span class="spinner"></span>
    Carregando fornecedores… aguarde.
  </div>
</div>

<!-- Etapa 2: seleção de ZIPs -->
<div class="card" id="secUpload" style="display:none">
  <div class="status ok" id="msgForn"></div>
  <div class="status muted" id="msgOrig" style="margin-top:4px">
    <span class="spinner" style="width:13px;height:13px;border-width:2px"></span>
    Carregando origens da BaseLinker… (pode levar 30-60 s)
  </div>
  <!-- Vendas Regulares -->
  <div style="margin-top:12px; font-weight:600; margin-bottom:8px;">📦 Vendas Regulares</div>
  <label class="file-label" for="zipFiles">
    📂 Selecionar ZIPs — Vendas Regulares<br>
    <span class="muted">Limpa a planilha e grava do zero</span>
  </label>
  <input type="file" id="zipFiles" multiple accept=".zip">
  <div id="arquivosSel" class="muted" style="margin-top:4px"></div>
  <button class="btn btn-primary" id="btnProcessar" onclick="processarZips(false)" disabled style="margin-top:8px">
    ▶ Processar Vendas Regulares
  </button>

  <hr style="margin:16px 0; border:none; border-top:1px solid #e0e0e0">

  <!-- Vendas Full -->
  <div style="font-weight:600; margin-bottom:8px;">🏭 Vendas Full (Fulfillment)</div>
  <label class="file-label" for="zipFilesFull" style="border-color:#34a853; color:#188038; background:#f0fff4">
    📂 Selecionar ZIPs — Vendas Full<br>
    <span class="muted">Adiciona à planilha existente (não apaga)</span>
  </label>
  <input type="file" id="zipFilesFull" multiple accept=".zip">
  <div id="arquivosSelFull" class="muted" style="margin-top:4px"></div>
  <button class="btn btn-secondary" id="btnProcessarFull" onclick="processarZips(true)" disabled style="margin-top:8px; border-color:#34a853; color:#188038">
    ▶ Upload ZIPs Vendas Full
  </button>

  <hr style="margin:16px 0; border:none; border-top:1px solid #e0e0e0">

  <!-- Compras -->
  <div style="font-weight:600; margin-bottom:8px;">📋 Notas de Compra</div>
  <label class="file-label" for="zipFilesCompras" style="border-color:#9c27b0; color:#7b1fa2; background:#fdf4ff">
    📂 Selecionar ZIPs — Compras<br>
    <span class="muted">Limpa a aba Compras e grava do zero</span>
  </label>
  <input type="file" id="zipFilesCompras" multiple accept=".zip">
  <div id="arquivosSelCompras" class="muted" style="margin-top:4px"></div>
  <button class="btn" id="btnProcessarCompras" onclick="processarZipsCompras()" disabled
          style="margin-top:8px; background:#9c27b0; color:#fff;">
    ▶ Upload ZIPs Compras
  </button>
</div>

<!-- Etapa 3: progresso dos XMLs -->
<div class="card" id="secProgresso" style="display:none">
  <div class="status" id="msgProgresso"></div>
  <progress id="barraProgresso" max="100" value="0"></progress>
  <div class="log" id="logTexto"></div>
</div>


<!-- JSZip via CDN -->
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
var fornMap = {};
var origMap = {};

// ── Etapa 1: carrega apenas fornecedores (rápido) ─────────────
google.script.run
  .withSuccessHandler(function(json) {
    var r = JSON.parse(json);
    if (!r.ok) {
      document.getElementById('msgCarregar').innerHTML =
        '<span class="err">❌ Erro: ' + r.error + '</span>';
      return;
    }
    fornMap = r.fornMap;
    var nForn = Object.keys(fornMap).length;
    document.getElementById('secCarregar').style.display = 'none';
    document.getElementById('msgForn').textContent = '✅ ' + nForn + ' fornecedores carregados';
    document.getElementById('secUpload').style.display = 'block';

    // ── Etapa 1b: origens da BaseLinker ───────────────────────
    google.script.run
      .withSuccessHandler(function(json2) {
        var r2 = JSON.parse(json2);
        var msgOrig = document.getElementById('msgOrig');
        if (!r2.ok) {
          msgOrig.innerHTML = '<span class="err">⚠ Origem virá do XML: ' + r2.error + '</span>';
          return;
        }
        origMap = r2.origMap || {};
        msgOrig.innerHTML = '<span class="ok">✅ ' + r2.total + ' origens carregadas da BaseLinker</span>';
      })
      .withFailureHandler(function(e) {
        document.getElementById('msgOrig').innerHTML =
          '<span class="err">⚠ Origem virá do XML (' + e.message + ')</span>';
      })
      .nfe_precarregarOrigem();

  })
  .withFailureHandler(function(e) {
    document.getElementById('msgCarregar').innerHTML =
      '<span class="err">❌ ' + e.message + '</span>';
  })
  .nfe_precarregar();

// ── Seleção de arquivos ───────────────────────────────────────
document.getElementById('zipFiles').addEventListener('change', function() {
  var nomes = [];
  for (var i = 0; i < this.files.length; i++) nomes.push(this.files[i].name);
  document.getElementById('arquivosSel').textContent =
    this.files.length + ' arquivo(s): ' + nomes.join(', ');
  document.getElementById('btnProcessar').disabled = !this.files.length;
});

document.getElementById('zipFilesFull').addEventListener('change', function() {
  var nomes = [];
  for (var i = 0; i < this.files.length; i++) nomes.push(this.files[i].name);
  document.getElementById('arquivosSelFull').textContent =
    this.files.length + ' arquivo(s): ' + nomes.join(', ');
  document.getElementById('btnProcessarFull').disabled = !this.files.length;
});

document.getElementById('zipFilesCompras').addEventListener('change', function() {
  var nomes = [];
  for (var i = 0; i < this.files.length; i++) nomes.push(this.files[i].name);
  document.getElementById('arquivosSelCompras').textContent =
    this.files.length + ' arquivo(s): ' + nomes.join(', ');
  document.getElementById('btnProcessarCompras').disabled = !this.files.length;
});

// ── Processa ZIPs ─────────────────────────────────────────────
// isAppend=false → limpa planilha (Regulares)
// isAppend=true  → adiciona ao final (Full)
async function processarZips(isAppend) {
  var inputId = isAppend ? 'zipFilesFull' : 'zipFiles';
  var btnId   = isAppend ? 'btnProcessarFull' : 'btnProcessar';
  var files   = document.getElementById(inputId).files;
  if (!files.length) { alert('Selecione ao menos um ZIP.'); return; }

  document.getElementById(btnId).disabled = true;
  document.getElementById('secProgresso').style.display = 'block';
  var label = isAppend ? '🏭 Full' : '📦 Regular';

  var allRows  = [];
  var xmlCount = 0;
  var errXml   = 0;

  for (var f = 0; f < files.length; f++) {
    log(label + ' — Extraindo: ' + files[f].name + ' (' + mb(files[f].size) + ')');
    setProgresso(0, 'Extraindo ZIP ' + (f+1) + '/' + files.length + '…');
    try {
      var zip      = await JSZip.loadAsync(files[f]);
      var xmlFiles = [];
      zip.forEach(function(path, entry) {
        if (!entry.dir && path.toLowerCase().endsWith('.xml')) xmlFiles.push(entry);
      });
      log('  → ' + xmlFiles.length + ' XMLs encontrados');

      for (var x = 0; x < xmlFiles.length; x++) {
        try {
          var text = await xmlFiles[x].async('string');
          var rows = parseNFe(text);
          allRows  = allRows.concat(rows);
          xmlCount++;
        } catch(e) {
          errXml++;
          log('  ⚠ Erro XML: ' + xmlFiles[x].name + ' — ' + e.message);
        }
        if (x % 200 === 0) {
          setProgresso(
            Math.round(((f / files.length) + (x / xmlFiles.length / files.length)) * 40),
            'Processando XMLs: ' + x + '/' + xmlFiles.length
          );
        }
      }
    } catch(e) {
      log('❌ Erro no ZIP: ' + e.message);
    }
  }

  log('📊 Total: ' + xmlCount + ' NFs | ' + allRows.length + ' linhas de produto');

  // Envia em lotes de 10000 linhas com retry automático (até 3 tentativas)
  var BATCH    = 10000;
  var isFirst  = !isAppend; // apenas o 1º lote de Regulares limpa a aba
  var gravadas = 0;
  var errLote  = false;
  var nLotes   = Math.ceil(allRows.length / BATCH);
  for (var i = 0; i < allRows.length; i += BATCH) {
    var lote    = allRows.slice(i, i + BATCH);
    var loteNum = Math.floor(i / BATCH) + 1;
    var pct     = 40 + Math.round(((i + lote.length) / allRows.length) * 60);
    setProgresso(pct, 'Gravando lote ' + loteNum + '/' + nLotes + ': ' +
      Math.min(i + BATCH, allRows.length) + '/' + allRows.length + ' linhas…');

    var ok = false;
    for (var tentativa = 1; tentativa <= 3; tentativa++) {
      try {
        await enviarLote(lote, isFirst);
        gravadas += lote.length;
        isFirst   = false;
        ok        = true;
        break;
      } catch(e) {
        log('⚠ Lote ' + loteNum + ', tentativa ' + tentativa + '/3: ' + e.message);
        if (tentativa < 3) await new Promise(function(r) { setTimeout(r, 2000 * tentativa); });
      }
    }
    if (!ok) {
      document.getElementById('msgProgresso').innerHTML =
        '<span class="err">❌ Falha no lote ' + loteNum + ' após 3 tentativas. ' +
        gravadas + ' de ' + allRows.length + ' linhas gravadas. Veja o log abaixo.</span>';
      errLote = true;
      break;
    }
  }

  setProgresso(100, '');
  if (!errLote) {
    document.getElementById('msgProgresso').innerHTML =
      '<span class="ok">✅ Dados gravados!</span><br>' +
      xmlCount + ' NFs processadas &nbsp;|&nbsp; ' +
      gravadas + ' linhas gravadas' +
      (errXml ? ' &nbsp;|&nbsp; ⚠ ' + errXml + ' XMLs com erro' : '');
  }

}

// ── Envia lote ao Apps Script ─────────────────────────────────
function enviarLote(rows, isFirst) {
  return new Promise(function(resolve, reject) {
    google.script.run
      .withSuccessHandler(function(r) { r.ok ? resolve() : reject(new Error(r.error)); })
      .withFailureHandler(function(e) { reject(e); })
      .nfe_processarLote(rows, isFirst);
  });
}

// ── Detecta empresa pelo xNome do emitente ───────────────────
function detectEmpresa(xNome) {
  var n = (xNome || '').toLowerCase();
  if (n.indexOf('humble')    >= 0) return 'Humble';
  if (n.indexOf('najumi')    >= 0) return 'Najumi';
  if (n.indexOf('edmotos')   >= 0) return 'Edmotos';
  if (n.indexOf('moto vibe') >= 0 || n.indexOf('motovibe') >= 0) return 'Moto Vibe';
  if (n.indexOf('sky')       >= 0) return 'Sky';
  if (n.indexOf('edmur')     >= 0) return 'Humble'; // ML Humble pessoa física
  if (n.indexOf('mirian')    >= 0) return 'Najumi'; // ML Najumi pessoa física
  return xNome || '';
}

// ── Detecta plataforma pelo idCadIntTran ─────────────────────
// Contém letras → Shopee; só números → ML
function detectPlataforma(idCadIntTran) {
  if (!idCadIntTran) return '';
  return /[a-zA-Z]/.test(idCadIntTran) ? 'Shopee' : 'ML';
}

// ── Parser NF-e (roda no browser) ────────────────────────────
function parseNFe(xmlText) {
  var parser = new DOMParser();
  var doc    = parser.parseFromString(xmlText, 'application/xml');
  if (doc.querySelector('parsererror')) return [];

  var infNFe = doc.getElementsByTagName('infNFe')[0];
  if (!infNFe) return [];

  function get(el, tag) {
    if (!el) return '';
    var els = el.getElementsByTagName(tag);
    return els.length ? els[0].textContent.trim() : '';
  }

  var ide   = infNFe.getElementsByTagName('ide')[0];
  var nNF   = get(ide, 'nNF');
  var serie = get(ide, 'serie');
  var dhEmi = get(ide, 'dhEmi');

  var data = '';
  if (dhEmi && dhEmi.length >= 10) {
    data = dhEmi.substring(8,10) + '/' + dhEmi.substring(5,7) + '/' + dhEmi.substring(0,4);
  }

  // ── Emitente → empresa ───────────────────────────────────────
  var emit     = infNFe.getElementsByTagName('emit')[0];
  var emitNome = emit ? get(emit, 'xNome') : '';
  var empresa  = detectEmpresa(emitNome);

  // ── infIntermed → plataforma ─────────────────────────────────
  var intermed     = infNFe.getElementsByTagName('infIntermed')[0];
  var idCadIntTran = intermed ? get(intermed, 'idCadIntTran') : '';
  var plataforma   = detectPlataforma(idCadIntTran);

  // Canal = plataforma + empresa (ex: "Shopee Humble", "ML Najumi")
  var canal = plataforma && empresa ? plataforma + ' ' + empresa
            : empresa || plataforma || '';

  var dest        = infNFe.getElementsByTagName('dest')[0];
  var cnpjCpf     = dest ? (get(dest, 'CNPJ') || get(dest, 'CPF')) : '';
  var nomeCliente = dest ? get(dest, 'xNome') : '';
  var ender       = dest ? dest.getElementsByTagName('enderDest')[0] : null;
  var uf          = ender ? get(ender, 'UF') : '';

  // Num NF para referência (col O)
  var numNF = nNF + (serie ? '/' + serie : '');

  var rows = [];
  var dets = infNFe.getElementsByTagName('det');

  for (var i = 0; i < dets.length; i++) {
    var det  = dets[i];
    var prod = det.getElementsByTagName('prod')[0];
    if (!prod) continue;

    var cfop      = get(prod, 'CFOP');
    var ncmRaw    = get(prod, 'NCM');
    var descricao = get(prod, 'xProd');
    var cProd     = get(prod, 'cProd');
    var qtd       = parseFloat(get(prod, 'qCom')   || '0') || 0;
    var vUnCom    = parseFloat(get(prod, 'vUnCom') || '0') || 0;
    var vProd     = parseFloat(get(prod, 'vProd')  || '0') || 0;

    // Origem: prefere o valor cadastrado na BaseLinker; cai no XML se não encontrar
    var orig = origMap[cProd] ||
               origMap[cProd.replace(/^0+/, '')] ||
               (function() {
                 var icmsEl = det.getElementsByTagName('ICMS')[0];
                 return icmsEl && icmsEl.firstElementChild
                   ? get(icmsEl.firstElementChild, 'orig') : '';
               })();

    var ncm = ncmRaw;
    if (/^\d{8}$/.test(ncmRaw)) {
      ncm = ncmRaw.slice(0,4) + '.' + ncmRaw.slice(4,6) + '.' + ncmRaw.slice(6,8);
    }

    var forn = fornMap[cProd] ||
               fornMap[cProd.replace(/^0+/, '')] ||
               'Sem Fornecedor';


    rows.push([
      data,         // A: Data
      cnpjCpf,      // B: CNPJ/CPF
      nomeCliente,  // C: Cliente
      'Sim',        // D: Consumidor Final
      uf,           // E: UF
      cfop,         // F: CFOP
      ncm,          // G: NCM
      descricao,    // H: Descrição
      orig,         // I: Origem
      qtd,          // J: Qtd
      vUnCom,       // K: Vlr Unit
      vProd,        // L: Vlr Total
      canal,        // M: Canal (Shopee Humble, ML Najumi, etc.)
      forn,         // N: Fornecedor
      numNF,        // O: Num NF
      idCadIntTran, // P: ID Canal
      empresa,      // Q: Emitente
      cProd,        // R: SKU
    ]);
  }
  return rows;
}

// ── Parser NF-e de COMPRA ─────────────────────────────────────
function parseNFeCompras(xmlText) {
  var parser = new DOMParser();
  var doc    = parser.parseFromString(xmlText, 'application/xml');
  if (doc.querySelector('parsererror')) return [];

  var infNFe = doc.getElementsByTagName('infNFe')[0];
  if (!infNFe) return [];

  function get(el, tag) {
    if (!el) return '';
    var els = el.getElementsByTagName(tag);
    return els.length ? els[0].textContent.trim() : '';
  }

  var ide   = infNFe.getElementsByTagName('ide')[0];
  var dhEmi = get(ide, 'dhEmi');
  var data  = '';
  if (dhEmi && dhEmi.length >= 10) {
    data = dhEmi.substring(8,10) + '/' + dhEmi.substring(5,7) + '/' + dhEmi.substring(0,4);
  }

  var emit     = infNFe.getElementsByTagName('emit')[0];
  var cnpjEmit = emit ? get(emit, 'CNPJ') : '';
  var nomeEmit = emit ? get(emit, 'xNome') : '';
  var crt      = emit ? get(emit, 'CRT') : '';
  var simples  = crt === '1' ? 'Sim' : 'Não';
  var enderEmit = emit ? emit.getElementsByTagName('enderEmit')[0] : null;
  var uf        = enderEmit ? get(enderEmit, 'UF') : '';

  var rows = [];
  var dets = infNFe.getElementsByTagName('det');

  for (var i = 0; i < dets.length; i++) {
    var det  = dets[i];
    var prod = det.getElementsByTagName('prod')[0];
    if (!prod) continue;

    var cfop      = get(prod, 'CFOP');
    var ncmRaw    = get(prod, 'NCM');
    var descricao = get(prod, 'xProd');
    var qtd       = parseFloat(get(prod, 'qCom')   || '0') || 0;
    var vUnCom    = parseFloat(get(prod, 'vUnCom') || '0') || 0;
    var vProd     = parseFloat(get(prod, 'vProd')  || '0') || 0;

    var origCode = '';
    var icmsEl = det.getElementsByTagName('ICMS')[0];
    if (icmsEl && icmsEl.firstElementChild) {
      origCode = get(icmsEl.firstElementChild, 'orig');
    }
    var origem = origCode === '0' ? 'Nacional' : (origCode !== '' ? 'Importado' : '');

    var ncm = ncmRaw;
    if (/^\d{8}$/.test(ncmRaw)) {
      ncm = ncmRaw.slice(0,4) + '.' + ncmRaw.slice(4,6) + '.' + ncmRaw.slice(6,8);
    }

    rows.push([
      data,      // A: Data
      cnpjEmit,  // B: CNPJ Emissor
      nomeEmit,  // C: Razão Social
      simples,   // D: Optante S.N.
      uf,        // E: Estado
      cfop,      // F: CFOP
      ncm,       // G: NCM
      descricao, // H: Descrição
      origem,    // I: Nacional/Importado
      qtd,       // J: Quantidade
      vUnCom,    // K: Valor Unitário
      vProd,     // L: Valor Total
    ]);
  }
  return rows;
}

// ── Processa ZIPs de Compras ──────────────────────────────────
async function processarZipsCompras() {
  var files = document.getElementById('zipFilesCompras').files;
  if (!files.length) { alert('Selecione ao menos um ZIP.'); return; }

  document.getElementById('btnProcessarCompras').disabled = true;
  document.getElementById('secProgresso').style.display   = 'block';

  var allRows  = [];
  var xmlCount = 0;
  var errXml   = 0;

  for (var f = 0; f < files.length; f++) {
    log('📋 Compras — Extraindo: ' + files[f].name + ' (' + mb(files[f].size) + ')');
    setProgresso(0, 'Extraindo ZIP ' + (f+1) + '/' + files.length + '…');
    try {
      var zip      = await JSZip.loadAsync(files[f]);
      var xmlFiles = [];
      zip.forEach(function(path, entry) {
        if (!entry.dir && path.toLowerCase().endsWith('.xml')) xmlFiles.push(entry);
      });
      log('  → ' + xmlFiles.length + ' XMLs encontrados');

      for (var x = 0; x < xmlFiles.length; x++) {
        try {
          var text = await xmlFiles[x].async('string');
          var rows = parseNFeCompras(text);
          allRows  = allRows.concat(rows);
          xmlCount++;
        } catch(e) {
          errXml++;
          log('  ⚠ Erro XML: ' + xmlFiles[x].name + ' — ' + e.message);
        }
        if (x % 200 === 0) {
          setProgresso(
            Math.round(((f / files.length) + (x / xmlFiles.length / files.length)) * 40),
            'Processando XMLs: ' + x + '/' + xmlFiles.length
          );
        }
      }
    } catch(e) {
      log('❌ Erro no ZIP: ' + e.message);
    }
  }

  log('📊 Total: ' + xmlCount + ' NFs | ' + allRows.length + ' linhas de produto');

  var BATCH    = 10000;
  var isFirst  = true;
  var gravadas = 0;
  var errLote  = false;
  var nLotes   = Math.ceil(allRows.length / BATCH);
  for (var i = 0; i < allRows.length; i += BATCH) {
    var lote    = allRows.slice(i, i + BATCH);
    var loteNum = Math.floor(i / BATCH) + 1;
    var pct     = 40 + Math.round(((i + lote.length) / allRows.length) * 60);
    setProgresso(pct, 'Gravando lote ' + loteNum + '/' + nLotes + ': ' +
      Math.min(i + BATCH, allRows.length) + '/' + allRows.length + ' linhas…');

    var ok = false;
    for (var tentativa = 1; tentativa <= 3; tentativa++) {
      try {
        await enviarLoteCompras(lote, isFirst);
        gravadas += lote.length;
        isFirst   = false;
        ok        = true;
        break;
      } catch(e) {
        log('⚠ Lote ' + loteNum + ', tentativa ' + tentativa + '/3: ' + e.message);
        if (tentativa < 3) await new Promise(function(r) { setTimeout(r, 2000 * tentativa); });
      }
    }
    if (!ok) {
      document.getElementById('msgProgresso').innerHTML =
        '<span class="err">❌ Falha no lote ' + loteNum + ' após 3 tentativas. ' +
        gravadas + ' de ' + allRows.length + ' linhas gravadas. Veja o log abaixo.</span>';
      errLote = true;
      break;
    }
  }

  setProgresso(100, '');
  if (!errLote) {
    document.getElementById('msgProgresso').innerHTML =
      '<span class="ok">✅ Compras gravadas!</span><br>' +
      xmlCount + ' NFs processadas &nbsp;|&nbsp; ' +
      gravadas + ' linhas gravadas' +
      (errXml ? ' &nbsp;|&nbsp; ⚠ ' + errXml + ' XMLs com erro' : '');
  }
}

function enviarLoteCompras(rows, isFirst) {
  return new Promise(function(resolve, reject) {
    google.script.run
      .withSuccessHandler(function(r) { r.ok ? resolve() : reject(new Error(r.error)); })
      .withFailureHandler(function(e) { reject(e); })
      .nfe_processarLoteCompras(rows, isFirst);
  });
}

// ── Helpers UI ────────────────────────────────────────────────
function setProgresso(pct, txt) {
  document.getElementById('barraProgresso').value = pct;
  if (txt) document.getElementById('msgProgresso').textContent = txt;
}
function log(msg) {
  var el = document.getElementById('logTexto');
  el.innerHTML += msg + '<br>';
  el.scrollTop = el.scrollHeight;
}
function mb(bytes) {
  return (bytes / 1048576).toFixed(1) + ' MB';
}
</script>
