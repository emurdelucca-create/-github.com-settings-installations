<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visão Geral — Separação</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #0d1117;
  --surface: #161b22;
  --border:  #30363d;
  --hdr:     #1c2333;
  --accent:  #388bfd;
  --green:   #3fb950;
  --amber:   #d29922;
  --red:     #f85149;
  --text:    #e6edf3;
  --muted:   #8b949e;
  --dim:     #484f58;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  font-size: 14px;
  overflow: hidden;
}

/* ── Layout ─────────────────────────────────────── */
#app {
  height: 100vh;
  display: grid;
  grid-template-rows: 50px 1fr 32px;
}

/* ── Header ─────────────────────────────────────── */
#header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
}
#header h1 {
  font-size: 15px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 0.5px;
}
#header-right { display: flex; align-items: center; gap: 10px; }
#timestamp { color: var(--muted); font-size: 12px; }

.hbtn {
  background: none;
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 3px 10px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  transition: all 0.15s;
  white-space: nowrap;
}
.hbtn:hover { border-color: var(--accent); color: var(--accent); }
.hbtn:disabled { opacity: 0.4; cursor: default; }

/* ── Main: 4 colunas ────────────────────────────── */
#main {
  display: grid;
  grid-template-columns: 270px 230px 1fr 190px;
  gap: 10px;
  padding: 10px 14px;
  overflow: hidden;
}

/* ── Painéis genéricos ───────────────────────────── */
.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.panel-title {
  padding: 7px 13px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--accent);
  border-bottom: 1px solid var(--border);
  background: var(--hdr);
  flex-shrink: 0;
}
.panel-body { overflow-y: auto; flex: 1; }

/* ── Tabela de Datas ─────────────────────────────── */
.tbl { width: 100%; border-collapse: collapse; }
.tbl tr:hover td { background: var(--hdr); }
.tbl td {
  padding: 7px 12px;
  border-bottom: 1px solid #1a2035;
  font-size: 13px;
  white-space: nowrap;
}

.td-date { color: var(--accent); font-weight: 500; width: 100px; }
.td-bar  { width: 100%; padding-right: 8px; }
.td-num  { color: var(--green); font-weight: 700; font-size: 14px; text-align: right; }

.bar-wrap { height: 5px; background: #1c2333; border-radius: 3px; }
.bar-fill { height: 100%; background: linear-gradient(90deg, #1f6feb, #3fb950); border-radius: 3px; transition: width 0.5s ease; }

tr.today td { background: rgba(63,185,80,0.06); }
tr.today .td-date { color: #58d68d; font-weight: 700; }
tr.today .td-num  { color: #58d68d; font-size: 15px; }

/* ── Status ──────────────────────────────────────── */
.st-row {
  display: flex;
  align-items: center;
  padding: 9px 12px;
  border-bottom: 1px solid #1a2035;
  gap: 8px;
}
.st-row:hover { background: var(--hdr); }
.st-nome {
  flex: 1;
  font-size: 14px;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.st-nome.erro { color: var(--red); }
.st-data {
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
}
.st-data.ok  { color: var(--green); }
.st-data.amb { color: var(--amber); }
.st-data.dim { color: var(--dim); }

/* ── SKUs — grid que se adapta ───────────────────── */
#skus-body {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
  align-content: start;
  overflow-y: auto;
  gap: 0;
}

.sku-col {
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}

.sku-date {
  padding: 5px 9px;
  font-size: 11px;
  font-weight: 700;
  color: var(--accent);
  background: var(--hdr);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.sku-date.hoje { color: #58d68d; }

.sku-row {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 4px 9px;
  border-bottom: 1px solid #161f2e;
  font-size: 12px;
}
.sku-row:nth-child(even) { background: #0f1520; }
.sku-row:hover { background: var(--hdr); }
.sku-code { flex: 1; font-family: 'Courier New', monospace; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sku-qty  { color: var(--green); font-weight: 700; font-size: 12px; min-width: 24px; text-align: right; }

/* ── Footer ─────────────────────────────────────── */
#footer {
  border-top: 1px solid var(--border);
  background: var(--surface);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  font-size: 11px;
  color: var(--dim);
}
#countdown b { color: var(--muted); }

/* ── Loading ─────────────────────────────────────── */
#loading {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 14px;
  z-index: 99;
}
.spin {
  width: 32px; height: 32px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: rot 0.7s linear infinite;
}
@keyframes rot { to { transform: rotate(360deg); } }
#loading p { color: var(--muted); font-size: 13px; }

/* ── Funcionários ────────────────────────────────── */
.func-row {
  display: flex;
  align-items: center;
  padding: 8px 10px;
  border-bottom: 1px solid #1a2035;
  gap: 6px;
}
.func-row:hover { background: var(--hdr); }
.func-nome {
  flex: 1;
  font-size: 12px;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.func-hoje {
  font-size: 18px;
  font-weight: 700;
  color: var(--green);
  min-width: 26px;
  text-align: right;
  line-height: 1;
}
.func-mes {
  font-size: 11px;
  color: var(--muted);
  min-width: 34px;
  text-align: right;
}
.func-empty {
  padding: 14px 10px;
  color: var(--muted);
  font-size: 12px;
  text-align: center;
}

::-webkit-scrollbar { width: 3px; height: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<div id="loading">
  <div class="spin"></div>
  <p id="loading-msg">Carregando dados...</p>
</div>

<div id="app" style="display:none;">

  <div id="header">
    <h1>📦 VISÃO GERAL SEPARAÇÃO</h1>
    <div id="header-right">
      <span id="timestamp"></span>
      <button class="hbtn" id="btn-refresh" onclick="carregarDados()">🔄 Atualizar</button>
      <button class="hbtn" id="btn-fs" onclick="toggleFullscreen()">⛶ Tela cheia</button>
    </div>
  </div>

  <div id="main">

    <!-- Coluna 1: Datas -->
    <div class="panel">
      <div class="panel-title">Pedidos por Data</div>
      <div class="panel-body">
        <table class="tbl" id="tbl-datas"></table>
      </div>
    </div>

    <!-- Coluna 2: Status -->
    <div class="panel">
      <div class="panel-title">Status Atual</div>
      <div class="panel-body" id="status-list"></div>
    </div>

    <!-- Coluna 3: SKUs -->
    <div class="panel">
      <div class="panel-title" id="skus-title">SKUs Mais Enviados</div>
      <div id="skus-body" class="panel-body"></div>
    </div>

    <!-- Coluna 4: Embaladores -->
    <div class="panel">
      <div class="panel-title">Embaladores — Hoje / Mês</div>
      <div class="panel-body" id="func-list"></div>
    </div>

  </div>

  <div id="footer">
    <span>Dados do BaseLinker · atualização automática a cada 5 min</span>
    <span id="countdown">Próximo refresh em <b id="cd">60</b>s</span>
  </div>

</div>

<script>
var cdSecs = 60;
var cdTimer;

function fmt(n) { return n.toLocaleString('pt-BR'); }

function carregarDados() {
  var btn = document.getElementById('btn-refresh');
  btn.disabled = true;
  btn.textContent = '⏳ Aguarde...';
  clearInterval(cdTimer);

  google.script.run
    .withSuccessHandler(function(d) {
      renderizar(d);
      document.getElementById('loading').style.display = 'none';
      document.getElementById('app').style.display = 'grid';
      btn.disabled = false;
      btn.textContent = '🔄 Atualizar';
      iniciarContagem();
    })
    .withFailureHandler(function(e) {
      document.getElementById('loading-msg').textContent = '❌ Erro: ' + e.message;
      btn.disabled = false;
      btn.textContent = '🔄 Atualizar';
    })
    .vg_getDados();
}

function iniciarContagem() {
  cdSecs = 60;
  clearInterval(cdTimer);
  cdTimer = setInterval(function() {
    cdSecs--;
    document.getElementById('cd').textContent = cdSecs;
    if (cdSecs <= 0) { clearInterval(cdTimer); carregarDados(); }
  }, 1000);
}

function renderizar(d) {
  var hoje = d.hoje;

  document.getElementById('timestamp').textContent = d.timestamp ? '⏱ ' + d.timestamp : '';

  // ── Datas: mais antiga no topo, mais nova embaixo ──
  var maxPed = 0;
  d.datas.forEach(function(r) { if (r.pedidos > maxPed) maxPed = r.pedidos; });

  var dtHtml = '';
  d.datas.forEach(function(row) {
    var isH = row.data === hoje;
    var pct = maxPed > 0 ? (row.pedidos / maxPed * 100).toFixed(1) : 0;
    dtHtml += '<tr class="' + (isH ? 'today' : '') + '">'
      + '<td class="td-date">' + row.data + (isH ? ' ◀' : '') + '</td>'
      + '<td class="td-bar"><div class="bar-wrap"><div class="bar-fill" style="width:' + pct + '%"></div></div></td>'
      + '<td class="td-num">' + fmt(row.pedidos) + '</td>'
      + '</tr>';
  });
  document.getElementById('tbl-datas').innerHTML = dtHtml;

  // ── Status ──
  var stHtml = '';
  d.status.forEach(function(s) {
    var isErro = s.nome.toLowerCase().indexOf('erro') >= 0;
    var cls = !s.dataAntiga ? 'dim' : (s.dataAntiga === hoje ? 'ok' : 'amb');
    stHtml += '<div class="st-row">'
      + '<span class="st-nome' + (isErro ? ' erro' : '') + '">' + (isErro ? '⚠ ' : '') + s.nome + '</span>'
      + '<span class="st-data ' + cls + '">' + (s.dataAntiga || '—') + '</span>'
      + '</div>';
  });
  document.getElementById('status-list').innerHTML = stHtml;

  // ── SKUs: todas as datas, mais antiga → mais nova ──
  var skusBody = document.getElementById('skus-body');
  document.getElementById('skus-title').textContent =
    'SKUs Mais Enviados — ' + d.skus.length + ' data' + (d.skus.length !== 1 ? 's' : '');

  skusBody.innerHTML = '';
  d.skus.forEach(function(bloco) {
    var col = document.createElement('div');
    col.className = 'sku-col';
    var isH  = bloco.data === hoje;
    var rows = bloco.itens.map(function(item) {
      return '<div class="sku-row"><span class="sku-code">' + item.sku + '</span><span class="sku-qty">' + item.qty + '</span></div>';
    }).join('');
    col.innerHTML = '<div class="sku-date' + (isH ? ' hoje' : '') + '">'
      + bloco.data + (isH ? ' ◀' : '')
      + '</div>' + rows;
    skusBody.appendChild(col);
  });

  // ── Funcionários ──
  var funcList = document.getElementById('func-list');
  if (d.funcionarios && d.funcionarios.length) {
    var fHtml = '';
    d.funcionarios.forEach(function(f) {
      fHtml += '<div class="func-row">'
        + '<span class="func-nome">' + f.nome + '</span>'
        + '<span class="func-hoje">' + f.hoje + '</span>'
        + '<span class="func-mes">/' + f.mes + '</span>'
        + '</div>';
    });
    funcList.innerHTML = fHtml;
  } else {
    funcList.innerHTML = '<div class="func-empty">Sem dados ainda.<br>Execute vg_atualizarEmbalagem().</div>';
  }
}

function toggleFullscreen() {
  var btn = document.getElementById('btn-fs');
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen();
    btn.textContent = '✕ Sair';
  } else {
    document.exitFullscreen();
    btn.textContent = '⛶ Tela cheia';
  }
}

document.addEventListener('fullscreenchange', function() {
  if (!document.fullscreenElement) document.getElementById('btn-fs').textContent = '⛶ Tela cheia';
});

carregarDados();
</script>
</body>
</html>
