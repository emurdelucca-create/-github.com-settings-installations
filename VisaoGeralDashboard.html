<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visão Geral — Separação</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #0d1117;
  --surface: #161b22;
  --border:  #30363d;
  --hdr:     #1c2333;
  --accent:  #388bfd;
  --green:   #3fb950;
  --amber:   #d29922;
  --red:     #f85149;
  --text:    #e6edf3;
  --muted:   #8b949e;
  --dim:     #484f58;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  font-size: 14px;
  line-height: 1.3;
  overflow: hidden;
}

/* ── Layout ─────────────────────────────────────── */
#app {
  height: 100vh;
  display: grid;
  grid-template-rows: 50px 38px 36px 1fr 32px;
}
/* Linha fixa por elemento — sem isso, esconder um item (ex: #sub-tabs
   quando a macro-aba não é Separação) faz o grid auto-posicionar os
   itens seguintes nas linhas vagas, empurrando #main pra uma faixa de
   36px e #footer pra ocupar o 1fr, "sumindo" com o conteúdo. */
#header     { grid-row: 1; }
#macro-tabs { grid-row: 2; }
#sub-tabs   { grid-row: 3; }
#main       { grid-row: 4; }
#footer     { grid-row: 5; }

/* ── Header ─────────────────────────────────────── */
#header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
}
#header h1 {
  font-size: 15px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 0.5px;
}
#header-right { display: flex; align-items: center; gap: 10px; }
#timestamps {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 1px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.3;
}
#timestamp-dados { color: var(--muted); }
#timestamp-visto { color: var(--dim); }

.hbtn {
  background: none;
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 3px 10px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  transition: all 0.15s;
  white-space: nowrap;
}
.hbtn:hover { border-color: var(--accent); color: var(--accent); }
.hbtn:disabled { opacity: 0.4; cursor: default; }

/* ── Macro tabs ──────────────────────────────────── */
#macro-tabs {
  display: flex;
  gap: 0;
  background: var(--hdr);
  border-bottom: 1px solid var(--border);
  padding: 0 14px;
}
.macro-tab {
  padding: 9px 22px 8px;
  font-size: 13px;
  line-height: 1.3;
  font-weight: 700;
  cursor: pointer;
  border: none;
  background: transparent;
  color: var(--muted);
  border-bottom: 3px solid transparent;
  transition: all 0.15s;
  letter-spacing: 0.3px;
}
.macro-tab:hover:not(:disabled) { color: var(--text); }
.macro-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.macro-tab:disabled { opacity: 0.35; cursor: default; }

/* ── Sub tabs ────────────────────────────────────── */
#sub-tabs {
  display: flex;
  gap: 0;
  background: #0f141d;
  border-bottom: 1px solid var(--border);
  padding: 0 14px;
}
.sub-tab {
  padding: 6px 18px 5px;
  font-size: 12px;
  line-height: 1.3;
  font-weight: 600;
  cursor: pointer;
  border: none;
  background: transparent;
  color: var(--muted);
  border-bottom: 2px solid transparent;
  transition: all 0.15s;
}
.sub-tab:hover { color: var(--text); }
.sub-tab.active.com  { color: var(--green); border-bottom-color: var(--green); }
.sub-tab.active.sem  { color: var(--red);   border-bottom-color: var(--red); }

/* ── Main: 3 colunas ─────────────────────────────── */
#main {
  display: grid;
  grid-template-columns: 270px 250px 1fr;
  gap: 10px;
  padding: 10px 14px;
  overflow: hidden;
}
#main-insuf-panel, #main-emb-panel { grid-column: 1 / -1; height: 100%; }

/* ── Embalagem: cards de KPI ─────────────────────── */
#emb-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  padding: 14px;
}
.emb-stat-card {
  background: var(--hdr);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
  text-align: center;
}
.emb-stat-value { font-size: 28px; font-weight: 800; color: var(--accent); line-height: 1.1; }
.emb-stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }
.emb-stat-label span { text-transform: none; letter-spacing: 0; display: block; font-size: 10px; color: var(--dim); }
#insuf-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 13px;
  border-bottom: 1px solid var(--border);
  background: #10151f;
  flex-shrink: 0;
}
#insuf-count { font-size: 12px; color: var(--muted); }
#insuf-copy { padding: 4px 12px; }
.tbl th {
  padding: 7px 12px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--muted);
  text-align: left;
  border-bottom: 1px solid var(--border);
  background: var(--hdr);
  position: sticky;
  top: 0;
}
.tbl th.num, .tbl td.td-num { text-align: right; }

/* ── Painéis genéricos ───────────────────────────── */
.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.panel-title {
  padding: 7px 13px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--accent);
  border-bottom: 1px solid var(--border);
  background: var(--hdr);
  flex-shrink: 0;
}
.panel-body { overflow-y: auto; flex: 1; }

/* ── Tabela de Datas ─────────────────────────────── */
.tbl { width: 100%; border-collapse: collapse; }
.tbl tr:hover td { background: var(--hdr); }
.tbl td {
  padding: 7px 12px;
  border-bottom: 1px solid #1a2035;
  font-size: 13px;
  white-space: nowrap;
}

.td-date { color: var(--accent); font-weight: 500; width: 100px; }
.td-bar  { width: 100%; padding-right: 8px; }
.td-num  { color: var(--green); font-weight: 700; font-size: 14px; text-align: right; }

.bar-wrap { height: 5px; background: #1c2333; border-radius: 3px; }
.bar-fill { height: 100%; background: linear-gradient(90deg, #1f6feb, #3fb950); border-radius: 3px; transition: width 0.5s ease; }

tr.today td { background: rgba(63,185,80,0.06); }
tr.today .td-date { color: #58d68d; font-weight: 700; }
tr.today .td-num  { color: #58d68d; font-size: 15px; }

tr.total-row td { border-top: 2px solid var(--border); border-bottom: none; padding-top: 10px; }
tr.total-row .td-date { color: var(--text); font-weight: 700; letter-spacing: 0.5px; font-size: 12px; }
tr.total-row .td-num  { color: var(--accent); font-size: 15px; }

.empty-msg { padding: 16px 12px; color: var(--muted); font-size: 12px; text-align: center; }

/* ── Status ──────────────────────────────────────── */
.st-row {
  display: flex;
  align-items: center;
  padding: 9px 12px;
  border-bottom: 1px solid #1a2035;
  gap: 8px;
  cursor: pointer;
  transition: background 0.12s;
}
.st-row:hover { background: var(--hdr); }
.st-row.selected { background: rgba(56,139,253,0.14); border-left: 3px solid var(--accent); padding-left: 9px; }
.st-row.geral { border-bottom: 2px solid var(--border); }
.st-nome {
  flex: 1;
  font-size: 14px;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.st-nome.erro { color: var(--red); }
.st-data {
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
}
.st-data.ok  { color: var(--green); }
.st-data.amb { color: var(--amber); }
.st-data.dim { color: var(--dim); }

/* ── SKUs — grid que se adapta, cada coluna rola sozinha ─── */
#skus-body {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  align-content: start;
  overflow-y: auto;
  gap: 0;
}

.sku-col {
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  max-height: 320px;
}

.sku-date {
  padding: 5px 9px;
  font-size: 11px;
  font-weight: 700;
  color: var(--accent);
  background: var(--hdr);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.sku-date.hoje { color: #58d68d; }

.sku-rows {
  overflow-y: auto;
  flex: 1;
  min-height: 0;
}

.sku-row {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 4px 9px;
  border-bottom: 1px solid #161f2e;
  font-size: 12px;
}
.sku-row:nth-child(even) { background: #0f1520; }
.sku-row:hover { background: var(--hdr); cursor: default; }
.sku-code { flex: 1; font-family: 'Courier New', monospace; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sku-qty  { color: var(--green); font-weight: 700; font-size: 12px; min-width: 24px; text-align: right; }

/* ── Popup de IDs de pedido (hover num SKU) ─────── */
#sku-popup {
  display: none;
  position: fixed;
  z-index: 300;
  background: var(--surface);
  border: 1px solid var(--accent);
  border-radius: 8px;
  padding: 9px;
  width: 190px;
  box-shadow: 0 10px 28px rgba(0,0,0,0.55);
}
#sku-popup-hdr {
  font-size: 10px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#sku-popup-list {
  max-height: 200px;
  overflow-y: auto;
  border: 1px solid var(--border);
  border-radius: 5px;
  margin-bottom: 7px;
}
.sku-popup-id {
  font-family: 'Courier New', monospace;
  font-size: 11px;
  padding: 4px 7px;
  border-bottom: 1px solid #161f2e;
  color: var(--text);
}
.sku-popup-id:last-child { border-bottom: none; }
.sku-popup-id:nth-child(even) { background: #0f1520; }
#sku-popup-copy {
  width: 100%;
  padding: 6px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 5px;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  transition: opacity 0.15s;
}
#sku-popup-copy:hover { opacity: 0.85; }

/* ── Footer ─────────────────────────────────────── */
#footer {
  border-top: 1px solid var(--border);
  background: var(--surface);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  font-size: 11px;
  color: var(--dim);
}
#countdown b { color: var(--muted); }

/* ── Loading ─────────────────────────────────────── */
#loading {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 14px;
  z-index: 99;
}
.spin {
  width: 32px; height: 32px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: rot 0.7s linear infinite;
}
@keyframes rot { to { transform: rotate(360deg); } }
#loading p { color: var(--muted); font-size: 13px; }

::-webkit-scrollbar { width: 3px; height: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ── Mobile ─────────────────────────────────────────
   O layout normal usa alturas fixas em px (#app grid-template-rows) e
   corta overflow, contando com o scroll interno de cada painel. Em telas
   estreitas isso fica apertado demais; abaixo de 820px a página passa a
   rolar inteira (célula "Main" com altura automática, empilhada em uma
   coluna só) em vez de tentar caber tudo numa tela só. */
@media (max-width: 820px) {
  html, body { height: auto; overflow-y: auto; overflow-x: hidden; font-size: 13px; }

  #app {
    height: auto;
    min-height: 100vh;
    grid-template-rows: auto auto auto auto auto;
    /* Sem isso, o Grid estica (align-content padrão = stretch) as faixas
       "auto" pra preencher o min-height inteiro, inflando cada linha
       proporcionalmente — abas de 38px viravam blocos de 140px+. */
    align-content: start;
  }

  #header { flex-wrap: wrap; gap: 6px; padding: 8px 12px; }
  #header h1 { font-size: 13px; }
  #header-right { gap: 6px; }
  #timestamps { display: none; } /* cabe pouco espaço; hora já aparece nas abas */
  #btn-atualizar-planilha { padding: 3px 8px; font-size: 11px; }

  #macro-tabs, #sub-tabs {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  #macro-tabs::-webkit-scrollbar, #sub-tabs::-webkit-scrollbar { display: none; }
  .macro-tab { padding: 8px 14px 7px; font-size: 12px; white-space: nowrap; }
  .sub-tab   { padding: 6px 12px 5px; font-size: 11px; white-space: nowrap; }

  #main {
    grid-template-columns: 1fr;
    grid-auto-rows: auto;
    overflow: visible;
    padding: 8px;
    gap: 8px;
  }
  .panel { max-height: 300px; }
  .panel-body { -webkit-overflow-scrolling: touch; }

  #skus-body { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
  .sku-col { max-height: 220px; }

  #main-insuf-panel, #main-emb-panel { grid-column: 1; max-height: none; }
  #emb-stats { grid-template-columns: 1fr; gap: 8px; padding: 10px; }
  .emb-stat-value { font-size: 22px; }
  #insuf-toolbar { flex-wrap: wrap; gap: 8px; }
  .tbl th, .tbl td { padding: 6px 8px; font-size: 12px; }

  #sku-popup { width: 160px; max-width: calc(100vw - 24px); }

  #footer {
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
    padding: 8px 12px;
    font-size: 10px;
  }
}
</style>
</head>
<body>

<div id="loading">
  <div class="spin"></div>
  <p id="loading-msg">Carregando dados...</p>
</div>

<div id="app" style="display:none;">

  <div id="header">
    <h1>📦 VISÃO GERAL SEPARAÇÃO</h1>
    <div id="header-right">
      <span id="timestamps">
        <span id="timestamp-dados"></span>
        <span id="timestamp-visto"></span>
      </span>
      <button class="hbtn" id="btn-atualizar-planilha" onclick="atualizarPlanilha()">🌐 Atualizar Planilha</button>
      <button class="hbtn" id="btn-refresh" onclick="carregarDados()">🔄 Atualizar</button>
      <button class="hbtn" id="btn-fs" onclick="toggleFullscreen()">⛶ Tela cheia</button>
    </div>
  </div>

  <div id="macro-tabs">
    <button class="macro-tab active" id="mtab-sep" onclick="setMacroTab('separacao')">📦 Separação</button>
    <button class="macro-tab" id="mtab-insuf" onclick="setMacroTab('insuficiente')">⚠️ Estoque Insuficiente</button>
    <button class="macro-tab" id="mtab-emb" onclick="setMacroTab('embalagem')">📊 Embalagem</button>
  </div>

  <div id="sub-tabs">
    <button class="sub-tab active com" id="stab-com" onclick="setSubTab('comEstoque')">📦 Com Estoque</button>
    <button class="sub-tab sem" id="stab-sem" onclick="setSubTab('semEstoque')">📉 Sem Estoque</button>
  </div>

  <div id="main">

    <div id="main-sep-cols" style="display:contents;">
      <!-- Coluna 1: Datas -->
      <div class="panel">
        <div class="panel-title">Pedidos por Data</div>
        <div class="panel-body">
          <table class="tbl" id="tbl-datas"></table>
        </div>
      </div>

      <!-- Coluna 2: Status -->
      <div class="panel">
        <div class="panel-title" id="status-title">Status Atual</div>
        <div class="panel-body" id="status-list"></div>
      </div>

      <!-- Coluna 3: SKUs -->
      <div class="panel">
        <div class="panel-title" id="skus-title">SKUs por Data</div>
        <div id="skus-body" class="panel-body"></div>
      </div>
    </div>

    <!-- Estoque Insuficiente: painel único, alimentado pela extensão -->
    <div id="main-insuf-panel" class="panel" style="display:none;">
      <div class="panel-title">⚠️ Estoque Insuficiente <span id="insuf-ts" style="float:right;font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted);"></span></div>
      <div id="insuf-toolbar">
        <span id="insuf-count"></span>
        <button class="hbtn" id="insuf-copy">📋 Copiar todos os SKUs</button>
      </div>
      <div class="panel-body">
        <table class="tbl" id="tbl-insuf" style="width:100%;"></table>
      </div>
    </div>

    <!-- Embalagem: KPIs + ranking de funcionários, do ledger permanente -->
    <div id="main-emb-panel" class="panel" style="display:none;">
      <div class="panel-title">📊 Embalagem <span id="emb-ts" style="float:right;font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted);"></span></div>
      <div class="panel-body">
        <div id="emb-stats">
          <div class="emb-stat-card">
            <div class="emb-stat-value" id="emb-hoje">—</div>
            <div class="emb-stat-label">Embalados hoje</div>
          </div>
          <div class="emb-stat-card">
            <div class="emb-stat-value" id="emb-pico-qtd">—</div>
            <div class="emb-stat-label">Pico do mês <span id="emb-pico-data"></span></div>
          </div>
          <div class="emb-stat-card">
            <div class="emb-stat-value" id="emb-mes-total">—</div>
            <div class="emb-stat-label" id="emb-mes-label">Total do mês</div>
          </div>
        </div>
        <table class="tbl" id="tbl-emb" style="width:100%;"></table>
      </div>
    </div>

  </div>

  <div id="footer">
    <span>Dados do BaseLinker · atualização automática a cada 5 min</span>
    <span id="countdown">Próximo refresh em <b id="cd">60</b>s</span>
  </div>

</div>

<script>
var cdSecs = 60;
var cdTimer;
var dadosGlobais = null;
var state = { macroTab: 'separacao', tab: 'comEstoque', statusFiltro: 'Geral' };

function fmt(n) { return n.toLocaleString('pt-BR'); }

function escHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function escAttr(s) {
  return escHtml(s).replace(/"/g, '&quot;');
}

// Listener delegado: um clique em qualquer .st-row dispara o filtro pelo
// status guardado em data-status (evita montar onclick inline com o nome
// do status embutido na string HTML).
document.getElementById('status-list').addEventListener('click', function(e) {
  var row = e.target.closest('.st-row');
  if (row) setStatusFiltro(row.getAttribute('data-status'));
});

// ── Popup de IDs de pedido (hover num SKU) ──────────────────────
// data-order-ids já vem pronto do servidor (lista de order_id que
// geraram aquela soma de quantidade, já filtrada pelo status atual).
var skuPopupEl = null;

function criarSkuPopup() {
  if (skuPopupEl) return skuPopupEl;
  skuPopupEl = document.createElement('div');
  skuPopupEl.id = 'sku-popup';
  skuPopupEl.innerHTML = '<div id="sku-popup-hdr"></div><div id="sku-popup-list"></div><button id="sku-popup-copy">📋 Copiar todos</button>';
  document.body.appendChild(skuPopupEl);
  // Mouse pode entrar no popup (pra clicar em copiar) sem ele sumir —
  // só esconde de fato quando sai do popup também.
  skuPopupEl.addEventListener('mouseleave', function() { skuPopupEl.style.display = 'none'; });
  return skuPopupEl;
}

function mostrarSkuPopup(row) {
  var sku = row.getAttribute('data-sku') || '';
  var ids = (row.getAttribute('data-order-ids') || '').split(',').filter(Boolean);
  if (!ids.length) return;

  var popup = criarSkuPopup();
  document.getElementById('sku-popup-hdr').textContent = sku + ' — ' + ids.length + ' pedido' + (ids.length !== 1 ? 's' : '');
  document.getElementById('sku-popup-list').innerHTML = ids.map(function(id) {
    return '<div class="sku-popup-id">' + escHtml(id) + '</div>';
  }).join('');
  document.getElementById('sku-popup-copy').onclick = function() {
    var btn = document.getElementById('sku-popup-copy');
    navigator.clipboard.writeText(ids.join('\n')).then(function() {
      var orig = btn.textContent;
      btn.textContent = '✅ Copiado!';
      setTimeout(function() { btn.textContent = orig; }, 1200);
    });
  };

  popup.style.display = 'block';
  var rect = row.getBoundingClientRect();
  var pw = popup.offsetWidth, ph = popup.offsetHeight;
  var left = rect.right + 8;
  var top  = rect.top;
  if (left + pw > window.innerWidth)  left = rect.left - pw - 8;
  if (top + ph > window.innerHeight)  top  = window.innerHeight - ph - 8;
  if (top < 4) top = 4;
  popup.style.left = left + 'px';
  popup.style.top  = top + 'px';
}

document.getElementById('skus-body').addEventListener('mouseover', function(e) {
  var row = e.target.closest('.sku-row');
  if (row) mostrarSkuPopup(row);
});
document.getElementById('skus-body').addEventListener('mouseout', function(e) {
  var row = e.target.closest('.sku-row');
  if (!row) return;
  // Dá uma folga curta: se o mouse foi para o próprio popup, não esconde
  // (o listener de mouseleave do popup cuida de escondê-lo depois).
  setTimeout(function() {
    if (skuPopupEl && !skuPopupEl.matches(':hover') && !row.matches(':hover')) {
      skuPopupEl.style.display = 'none';
    }
  }, 80);
});

function carregarDados() {
  var btn = document.getElementById('btn-refresh');
  var btnPlan = document.getElementById('btn-atualizar-planilha');
  btn.disabled = true;
  btnPlan.disabled = true;
  btn.textContent = '⏳ Aguarde...';
  clearInterval(cdTimer);

  google.script.run
    .withSuccessHandler(function(d) {
      dadosGlobais = d;
      renderizarTudo();
      document.getElementById('loading').style.display = 'none';
      document.getElementById('app').style.display = 'grid';
      btn.disabled = false;
      btnPlan.disabled = false;
      btn.textContent = '🔄 Atualizar';
      iniciarContagem();
    })
    .withFailureHandler(function(e) {
      document.getElementById('loading-msg').textContent = '❌ Erro: ' + e.message;
      btn.disabled = false;
      btnPlan.disabled = false;
      btn.textContent = '🔄 Atualizar';
    })
    .vg_getDados();
}

// Botão "🌐 Atualizar Planilha" — dispara a busca de verdade no BaseLinker
// (vg_atualizarEExibir no servidor), diferente do "🔄 Atualizar" que só
// relê o que já está na planilha. Pode demorar bem mais (chamadas de API
// paginadas em vários status), por isso o aviso "pode demorar" no botão.
function atualizarPlanilha() {
  var btn = document.getElementById('btn-atualizar-planilha');
  var btnRef = document.getElementById('btn-refresh');
  btn.disabled = true;
  btnRef.disabled = true;
  clearInterval(cdTimer);
  btn.textContent = '⏳ Buscando no BaseLinker... (pode demorar)';

  google.script.run
    .withSuccessHandler(function(d) {
      dadosGlobais = d;
      renderizarTudo();
      btn.disabled = false;
      btnRef.disabled = false;
      btn.textContent = '🌐 Atualizar Planilha';
      iniciarContagem();
    })
    .withFailureHandler(function(e) {
      alert('❌ Erro ao atualizar a planilha: ' + e.message);
      btn.disabled = false;
      btnRef.disabled = false;
      btn.textContent = '🌐 Atualizar Planilha';
    })
    .vg_atualizarEExibir();
}

// Data/hora local do navegador — usada só pra "Última visualização"
// (quando ESTA tela buscou dados pela última vez, que pode ser diferente
// de quando a planilha foi realmente atualizada no servidor).
function agoraFormatado() {
  var d = new Date();
  function p(n) { return String(n).padStart(2, '0'); }
  return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}

function iniciarContagem() {
  cdSecs = 60;
  clearInterval(cdTimer);
  cdTimer = setInterval(function() {
    cdSecs--;
    document.getElementById('cd').textContent = cdSecs;
    if (cdSecs <= 0) { clearInterval(cdTimer); carregarDados(); }
  }, 1000);
}

function setMacroTab(tab) {
  state.macroTab = tab;
  document.getElementById('mtab-sep').className   = 'macro-tab' + (tab === 'separacao'    ? ' active' : '');
  document.getElementById('mtab-insuf').className = 'macro-tab' + (tab === 'insuficiente' ? ' active' : '');
  document.getElementById('mtab-emb').className   = 'macro-tab' + (tab === 'embalagem'    ? ' active' : '');
  document.getElementById('sub-tabs').style.display        = tab === 'separacao' ? 'flex' : 'none';
  document.getElementById('main-sep-cols').style.display    = tab === 'separacao'    ? 'contents' : 'none';
  document.getElementById('main-insuf-panel').style.display = tab === 'insuficiente' ? 'flex'     : 'none';
  document.getElementById('main-emb-panel').style.display   = tab === 'embalagem'    ? 'flex'     : 'none';
  if (tab === 'insuficiente') renderizarInsuficiente();
  if (tab === 'embalagem') renderizarEmbalagem();
}

function setSubTab(tab) {
  state.tab = tab;
  state.statusFiltro = 'Geral';
  document.getElementById('stab-com').className = 'sub-tab com' + (tab === 'comEstoque' ? ' active' : '');
  document.getElementById('stab-sem').className = 'sub-tab sem' + (tab === 'semEstoque' ? ' active' : '');
  renderizarSecao();
}

function setStatusFiltro(nome) {
  state.statusFiltro = nome;
  renderizarSecao();
}

function renderizarTudo() {
  var d = dadosGlobais;
  document.getElementById('timestamp-dados').textContent = d.timestamp ? '📊 Dados: ' + d.timestamp : '';
  document.getElementById('timestamp-visto').textContent = '👁 Visto: ' + agoraFormatado();
  renderizarSecao();
  renderizarInsuficiente();
  renderizarEmbalagem();
}

// ── Macro-aba "Embalagem" — KPIs + ranking de funcionários, tudo
// derivado do ledger permanente no servidor (nunca some, mesmo que um
// pedido saia do BaseLinker depois de já ter sido contado).
function renderizarEmbalagem() {
  var d   = dadosGlobais;
  var emb = (d && d.embalagem) || { hoje: 0, picoData: '', picoQtd: 0, mes: '' };
  var funcionarios = (d && d.funcionarios) || [];

  document.getElementById('emb-ts').textContent = d && d.timestamp ? '📡 ' + d.timestamp : '';
  document.getElementById('emb-hoje').textContent = fmt(emb.hoje);
  document.getElementById('emb-pico-qtd').textContent = fmt(emb.picoQtd);
  document.getElementById('emb-pico-data').textContent = emb.picoData || '—';
  document.getElementById('emb-mes-label').innerHTML = 'Total do mês<span>' + escHtml(emb.mes || '') + '</span>';
  var totalMes = funcionarios.reduce(function(acc, f) { return acc + (f.mes || 0); }, 0);
  document.getElementById('emb-mes-total').textContent = fmt(totalMes);

  var tbl = document.getElementById('tbl-emb');
  if (!funcionarios.length) {
    tbl.innerHTML = '<tr><td class="empty-msg">Nenhum pedido embalado identificado ainda. O sistema varre os comentários a cada 5 min e vai preenchendo aqui.</td></tr>';
    return;
  }
  var html = '<tr><th>FUNCIONÁRIO</th><th class="num">HOJE</th><th class="num">MÊS</th></tr>';
  funcionarios.forEach(function(f) {
    html += '<tr>'
      + '<td class="td-date">' + escHtml(f.nome) + '</td>'
      + '<td class="td-num" style="color:var(--green)">' + fmt(f.hoje) + '</td>'
      + '<td class="td-num" style="color:var(--accent)">' + fmt(f.mes) + '</td>'
      + '</tr>';
  });
  tbl.innerHTML = html;
}

// ── Macro-aba "Estoque Insuficiente" — alimentada pela extensão ──
// dadosGlobais.estoqueInsuficiente.itens já vem filtrado pelo servidor:
// só SKUs com qtdInsuficiente > 0 aparecem aqui.
function renderizarInsuficiente() {
  var d = dadosGlobais;
  var info = (d && d.estoqueInsuficiente) || { timestamp: '', itens: [] };
  document.getElementById('insuf-ts').textContent = info.timestamp ? '📡 Captura: ' + info.timestamp : '';
  document.getElementById('insuf-count').textContent =
    info.itens.length + ' SKU' + (info.itens.length !== 1 ? 's' : '') + ' com estoque insuficiente';

  var tbl = document.getElementById('tbl-insuf');
  if (!info.itens.length) {
    tbl.innerHTML = '<tr><td class="empty-msg">Nenhum SKU com estoque insuficiente na última captura.</td></tr>';
  } else {
    var html = '<tr><th>SKU</th><th class="num">Qtd Insuficiente</th><th class="num">Qtd Com Localização</th></tr>';
    info.itens.forEach(function(it) {
      html += '<tr>'
        + '<td class="td-date">' + escHtml(it.sku) + '</td>'
        + '<td class="td-num" style="color:var(--red)">' + fmt(it.qtdInsuficiente) + '</td>'
        + '<td class="td-num" style="color:var(--green)">' + fmt(it.qtdComLocalizacao) + '</td>'
        + '</tr>';
    });
    tbl.innerHTML = html;
  }

  // Botão de copiar: só os SKUs, um por linha — cola direto no Excel/Sheets
  // com cada SKU já numa célula própria.
  document.getElementById('insuf-copy').onclick = function() {
    var btn = document.getElementById('insuf-copy');
    var texto = info.itens.map(function(it) { return it.sku; }).join('\n');
    navigator.clipboard.writeText(texto).then(function() {
      var orig = btn.textContent;
      btn.textContent = '✅ Copiado!';
      setTimeout(function() { btn.textContent = orig; }, 1200);
    });
  };
}

function renderizarSecao() {
  var d = dadosGlobais;
  if (!d) return;
  var hoje = d.hoje;
  var secao = d[state.tab];

  if (!secao) {
    document.getElementById('tbl-datas').innerHTML = '';
    document.getElementById('status-list').innerHTML = '<div class="empty-msg">Sem dados. Atualize a planilha.</div>';
    document.getElementById('skus-body').innerHTML = '';
    return;
  }

  var isSem = state.tab === 'semEstoque';
  document.getElementById('status-title').textContent = isSem ? 'Status Atual — Sem Estoque' : 'Status Atual — Com Estoque';

  // ── Datas: mais antiga no topo, mais nova embaixo ──
  var maxPed = 0;
  secao.datas.forEach(function(r) { if (r.pedidos > maxPed) maxPed = r.pedidos; });

  var dtHtml = '';
  if (!secao.datas.length) {
    dtHtml = '<tr><td class="empty-msg" colspan="3">Nenhum pedido nesta categoria.</td></tr>';
  }
  var totalPed = 0;
  secao.datas.forEach(function(row) {
    var isH = row.data === hoje;
    var pct = maxPed > 0 ? (row.pedidos / maxPed * 100).toFixed(1) : 0;
    totalPed += row.pedidos;
    dtHtml += '<tr class="' + (isH ? 'today' : '') + '">'
      + '<td class="td-date">' + row.data + (isH ? ' ◀' : '') + '</td>'
      + '<td class="td-bar"><div class="bar-wrap"><div class="bar-fill" style="width:' + pct + '%"></div></div></td>'
      + '<td class="td-num">' + fmt(row.pedidos) + '</td>'
      + '</tr>';
  });
  if (secao.datas.length) {
    dtHtml += '<tr class="total-row">'
      + '<td class="td-date">TOTAL</td>'
      + '<td></td>'
      + '<td class="td-num">' + fmt(totalPed) + '</td>'
      + '</tr>';
  }
  document.getElementById('tbl-datas').innerHTML = dtHtml;

  // ── Status (clicável) + linha "Geral" ──
  // data-status + listener delegado (ver mais abaixo), em vez de onclick
  // inline, para não ter que escapar aspas do nome do status na string HTML.
  var stHtml = '<div class="st-row geral' + (state.statusFiltro === 'Geral' ? ' selected' : '') + '" data-status="Geral">'
    + '<span class="st-nome">📋 Geral (todos os status)</span>'
    + '</div>';
  secao.status.forEach(function(s) {
    var isErro = s.nome.toLowerCase().indexOf('erro') >= 0;
    var cls = !s.dataAntiga ? 'dim' : (s.dataAntiga === hoje ? 'ok' : 'amb');
    var sel = state.statusFiltro === s.nome ? ' selected' : '';
    stHtml += '<div class="st-row' + sel + '" data-status="' + escAttr(s.nome) + '">'
      + '<span class="st-nome' + (isErro ? ' erro' : '') + '">' + (isErro ? '⚠ ' : '') + escHtml(s.nome) + '</span>'
      + '<span class="st-data ' + cls + '">' + (s.dataAntiga || '—') + '</span>'
      + '</div>';
  });
  document.getElementById('status-list').innerHTML = stHtml;

  // ── SKUs: filtrado pelo status selecionado (ou Geral) ──
  var blocos = (secao.skusPorStatus && secao.skusPorStatus[state.statusFiltro]) || [];
  var skusBody = document.getElementById('skus-body');
  document.getElementById('skus-title').textContent =
    'SKUs por Data — ' + state.statusFiltro + ' (' + blocos.length + ' data' + (blocos.length !== 1 ? 's' : '') + ')';

  skusBody.innerHTML = '';
  if (!blocos.length) {
    skusBody.innerHTML = '<div class="empty-msg">Nenhum SKU nesta categoria/status.</div>';
  }
  blocos.forEach(function(bloco) {
    var col = document.createElement('div');
    col.className = 'sku-col';
    var isH  = bloco.data === hoje;
    var rows = bloco.itens.map(function(item) {
      var ids = item.orderIds || [];
      return '<div class="sku-row" data-sku="' + escAttr(item.sku) + '" data-order-ids="' + escAttr(ids.join(',')) + '">'
        + '<span class="sku-code">' + escHtml(item.sku) + '</span><span class="sku-qty">' + item.qty + '</span></div>';
    }).join('');
    col.innerHTML = '<div class="sku-date' + (isH ? ' hoje' : '') + '">'
      + bloco.data + (isH ? ' ◀' : '')
      + '</div><div class="sku-rows">' + rows + '</div>';
    skusBody.appendChild(col);
  });
}

function toggleFullscreen() {
  var btn = document.getElementById('btn-fs');
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen();
    btn.textContent = '✕ Sair';
  } else {
    document.exitFullscreen();
    btn.textContent = '⛶ Tela cheia';
  }
}

document.addEventListener('fullscreenchange', function() {
  if (!document.fullscreenElement) document.getElementById('btn-fs').textContent = '⛶ Tela cheia';
});

carregarDados();
</script>
</body>
</html>
